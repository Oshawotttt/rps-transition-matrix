<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Across the Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gabarito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbfbf8;--ink:#20232b;--ink2:#4a4f5c;--wall:#f1efe8;--table:#c9d8c5;--rim:#7f9a7b;--r:#c24b3a;--p:#3462ad;--s:#d39b22;--w:#2f7b55;--t:#d8d5cc;--l:#c24b3a;
  --robot:#e6ebf1;--robot2:#a9b6c6;--screen:#20232b;--glow:#a6f0c6;--bulb:#d39b22;--blush:#f4b0a6;--tie:#3462ad;
  --jacket:#b4483a;--jacket2:#963a2f;--shirt:#fbfbf8;--tie2:#20232b;--skin:#f3cfae;--skin2:#e3b893;--hair:#2e2420;--face:#20232b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#e4e2da;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--ink);overflow:hidden}
::selection{background:var(--p);color:#fff}
:focus-visible{outline:3px solid var(--p);outline-offset:3px}
.frame{position:absolute;left:50%;top:50%;width:1440px;height:900px;background:var(--paper);overflow:hidden;transform-origin:0 0;font-variant-numeric:tabular-nums;display:flex;flex-direction:column}

.vec{display:inline-grid;position:relative;padding:3px 13px;gap:1px;text-align:right;vertical-align:middle}
.vec::before,.vec::after{content:"";position:absolute;top:0;bottom:0;width:8px;border:2.5px solid currentColor}
.vec::before{left:0;border-right:0}.vec::after{right:0;border-left:0}
.vec.h{display:inline-flex;gap:18px;padding:2px 13px}
.vt{font-size:.62em;position:relative;top:-.9em;margin-left:3px}
.ic{width:1em;height:1em;vertical-align:-.14em;fill:currentColor}
.mR{color:var(--r)}.mP{color:var(--p)}.mS{color:var(--s)}

/* characters */
.rb-head,.rb-body{fill:var(--robot)}.rb-ear,.rb-neck,.rb-dot{fill:var(--robot2)}.rb-screen{fill:var(--screen)}
.rb-eye{fill:var(--glow)}.rb-shine{fill:#fff}.rb-mouth{fill:none;stroke:var(--glow);stroke-width:4;stroke-linecap:round}
.rb-ant{stroke:var(--robot2);stroke-width:5;stroke-linecap:round}.rb-bulb{fill:var(--bulb)}.rb-cheek{fill:var(--blush);opacity:.85}.rb-tie{fill:var(--tie)}
.hu-jacket{fill:var(--jacket)}.hu-lapel{fill:var(--jacket2)}.hu-shirt{fill:var(--shirt)}.hu-tie{fill:var(--tie2)}
.hu-skin{fill:var(--skin)}.hu-neck{fill:var(--skin2)}.hu-hair{fill:var(--hair)}.hu-eye{fill:var(--face)}
.hu-smile{fill:none;stroke:var(--face);stroke-width:3.5;stroke-linecap:round}.hu-cheek{fill:var(--blush);opacity:.6}

/* scene */
.scene{position:relative;height:350px;transition:height .4s cubic-bezier(.16,1,.3,1);background:var(--wall);flex:none;overflow:hidden}
.tag{position:absolute;top:34px;font:800 34px/1 'Gabarito'}
.tag small{display:block;font:400 20px 'Atkinson Hyperlegible';margin-top:8px}
.tag.bot{left:64px}.tag.hum{right:64px;text-align:right}
.bust{position:absolute;bottom:84px;width:250px;height:250px;transition:width .4s cubic-bezier(.16,1,.3,1),height .4s cubic-bezier(.16,1,.3,1)}
.frame:has(.maths.closed) .scene{height:610px}
.frame:has(.maths.closed) .bust{width:400px;height:400px}
.frame:has(.maths.closed) .bust.bot{left:150px}.frame:has(.maths.closed) .bust.hum{right:150px}
.bust svg{width:100%;height:100%;display:block}
.bust.bot{left:236px}.bust.hum{right:236px}
.bust.hum svg{transform:scaleX(-1)}
.mid{position:absolute;left:50%;top:26px;transform:translateX(-50%);text-align:center;width:420px}
.score{font:800 88px/1 'Gabarito';letter-spacing:-.03em;display:flex;justify-content:center;align-items:baseline;gap:18px}
.score small{font:700 20px 'Atkinson Hyperlegible';letter-spacing:0;display:block;margin-top:4px}
.score .dash{font-weight:500}
.mid p{font-size:21px;margin-top:6px}
.tbl{position:absolute;left:0;right:0;bottom:0;height:100px;background:var(--table);border-top:10px solid var(--rim)}
.prev{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:22px}
.crd{width:104px;height:132px;background:var(--paper);border-radius:12px;box-shadow:0 10px 18px -8px rgba(32,35,43,.45);display:grid;place-items:center;align-content:center;gap:6px;font:700 19px 'Atkinson Hyperlegible';transition:transform .4s cubic-bezier(.16,1,.3,1)}
.crd svg.ic{width:54px;height:54px}
.crd.empty{background:transparent;box-shadow:inset 0 0 0 2.5px rgba(32,35,43,.35);color:var(--ink2);font-weight:400;font-size:16px}
.crd.b{transform:rotate(-5deg)}.crd.h{transform:rotate(5deg)}
.crd.won{box-shadow:0 10px 18px -8px rgba(32,35,43,.45),0 0 0 4px var(--w)}
.pcap{text-align:center;font:700 19px 'Atkinson Hyperlegible';background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 18px;white-space:nowrap;align-self:center;margin-bottom:38px}
.cardlab{position:absolute;bottom:160px;font:700 16px 'Atkinson Hyperlegible';color:var(--ink2);width:104px;text-align:center}

/* input row */
.play{flex:none;display:flex;align-items:center;gap:18px;padding:18px 64px;border-bottom:2px solid var(--t)}
.play h2{font:800 26px 'Gabarito';margin-right:8px;white-space:nowrap}
.play h2 small{display:block;font:400 17px 'Atkinson Hyperlegible';margin-top:4px;color:var(--ink2)}
.mv{display:flex;align-items:center;gap:12px;height:64px;padding:0 24px 0 18px;border:0;border-radius:14px;background:var(--wall);color:var(--ink);font:700 24px 'Atkinson Hyperlegible';cursor:pointer;box-shadow:inset 0 0 0 2px var(--t);transition:background .15s,box-shadow .15s,transform .15s}
.mv svg.ic{width:36px;height:36px}
.mv kbd{font:700 15px 'Atkinson Hyperlegible';border-radius:6px;padding:2px 7px;box-shadow:inset 0 0 0 1.5px var(--ink2);color:var(--ink2);margin-left:4px}
.mv:hover{background:#fff;box-shadow:inset 0 0 0 2px var(--ink);transform:translateY(-2px)}
.mv:active{transform:translateY(0)}
.mv:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:inset 0 0 0 2px var(--t);background:var(--wall)}
.sp{flex:1}
.ghost{height:48px;padding:0 18px;border:0;border-radius:12px;background:transparent;color:var(--ink);font:700 19px 'Atkinson Hyperlegible';cursor:pointer;box-shadow:inset 0 0 0 2px var(--t)}
.ghost:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.len{display:flex;gap:4px;padding:4px;border-radius:12px;box-shadow:inset 0 0 0 2px var(--t)}
.len button{height:40px;padding:0 14px;border:0;border-radius:9px;background:transparent;font:700 17px 'Atkinson Hyperlegible';color:var(--ink);cursor:pointer}
.len button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.len button:disabled{cursor:not-allowed}
.len button:disabled:not([aria-pressed="true"]){color:#a7a59e}

/* maths */
.maths{flex:1;display:flex;flex-direction:column;padding:0 64px;min-height:0}
.mhead{display:flex;align-items:center;gap:16px;padding:16px 0 4px}
.mhead h3{font:800 26px 'Gabarito'}
.mhead .x{font-size:21px}
.mhead .x b{font-weight:700}
.tog{margin-left:auto;display:flex;align-items:center;gap:10px}
.tog svg{width:18px;height:18px;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.maths.closed .tog svg{transform:rotate(180deg)}
.steps{display:grid;grid-template-columns:1fr 1.15fr 1fr;flex:1;min-height:0}
.step{padding:10px 28px 0;border-left:2px solid var(--t);display:flex;flex-direction:column;min-width:0}
.step:first-child{padding-left:0;border-left:0}.step:last-child{padding-right:0}
.sh{display:flex;align-items:center;gap:12px;font:800 26px 'Gabarito'}
.sh i{font:800 20px 'Gabarito';font-style:normal;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);flex:none}
.sh em{font:400 21px 'Atkinson Hyperlegible';font-style:normal}
.sum{font:700 22px 'Atkinson Hyperlegible';margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.body{overflow:hidden;transition:opacity .25s,max-height .4s cubic-bezier(.16,1,.3,1);max-height:320px;opacity:1}
.maths:not(.closed) #sum3{display:none}
.maths.closed .body{max-height:0;opacity:0}
.maths.closed .steps{flex:none;padding-bottom:18px}
.eq{font-size:22px;display:flex;align-items:center;gap:10px;margin:12px 0 10px;flex-wrap:wrap}
.note{font-size:17px;line-height:1.35;color:var(--ink2);margin-top:8px}
.vb{display:flex;align-items:flex-end;gap:16px;height:96px;border-bottom:2px solid var(--ink)}
.vb div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font:700 18px 'Atkinson Hyperlegible'}
.vb i{display:block;width:100%;border-radius:6px 6px 0 0;margin-top:4px;transition:height .5s cubic-bezier(.16,1,.3,1)}
.vl{display:flex;gap:16px;margin-top:6px;font:700 17px 'Atkinson Hyperlegible'}
.vl span{flex:1;text-align:center}
.stk{display:grid;gap:8px;margin-top:4px}
.st{display:grid;grid-template-columns:76px 1fr 72px;align-items:center;gap:10px;font:700 18px 'Atkinson Hyperlegible';padding:4px 6px;border-radius:9px}
.st .sb{display:flex;height:24px;border-radius:5px;overflow:hidden}
.st .sb i{display:block;height:100%;transition:width .5s cubic-bezier(.16,1,.3,1)}
.st span:last-child{text-align:right}
.st.pick{background:var(--wall)}
.key{display:flex;gap:16px;font-size:15px;margin-top:8px;color:var(--ink2)}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ch{display:flex;align-items:center;gap:16px;margin-top:12px;background:var(--wall);border-radius:14px;padding:14px 16px}
.ch svg.ic{width:56px;height:56px}
.ch b{font:800 32px/1 'Gabarito';display:block}
.ch span{font-size:17px;line-height:1.3;display:block;margin-top:4px}
.flag{margin-top:10px;font:700 17px 'Atkinson Hyperlegible';color:var(--l);display:none}
.flag.on{display:block}

/* match over */
.over{position:absolute;inset:0;background:rgba(32,35,43,.55);display:none;place-items:center}
.over.on{display:grid}
.over div{background:var(--paper);border-radius:16px;padding:36px 44px;text-align:center;box-shadow:0 24px 48px -16px rgba(0,0,0,.45)}
.over h2{font:800 52px/1 'Gabarito'}
.over p{font-size:22px;margin:12px 0 22px}
.over button{height:56px;padding:0 26px;border:0;border-radius:12px;background:var(--ink);color:var(--paper);font:700 21px 'Atkinson Hyperlegible';cursor:pointer}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="robot" viewBox="0 0 200 200">
    <line class="rb-ant" x1="100" y1="42" x2="100" y2="22"/><circle class="rb-bulb" cx="100" cy="16" r="8"/>
    <rect class="rb-ear" x="24" y="72" width="16" height="38" rx="7"/><rect class="rb-ear" x="160" y="72" width="16" height="38" rx="7"/>
    <rect class="rb-neck" x="86" y="136" width="28" height="16" rx="4"/>
    <path class="rb-body" d="M46 204V176c0-17 12-28 30-28h48c18 0 30 11 30 28v28z"/>

    <ellipse class="rb-eye" cx="79" cy="85" rx="8.5" ry="11"/><ellipse class="rb-eye" cx="121" cy="85" rx="8.5" ry="11"/>
    <circle class="rb-shine" cx="82" cy="80" r="2.6"/><circle class="rb-shine" cx="124" cy="80" r="2.6"/>

    <path class="rb-tie" d="M100 162 80 151v22zM100 162l20-11v22z"/><circle class="rb-tie" cx="100" cy="162" r="5.5"/>
    <circle class="rb-dot" cx="86" cy="188" r="3.5"/><circle class="rb-dot" cx="100" cy="188" r="3.5"/><circle class="rb-dot" cx="114" cy="188" r="3.5"/>
  </symbol>
  <symbol id="human" viewBox="0 0 200 200">
    <rect class="hu-neck" x="89" y="122" width="22" height="28" rx="6"/>
    <path class="hu-jacket" d="M40 204v-24c0-22 16-34 40-36h40c24 2 40 14 40 36v24z"/>
    <path class="hu-shirt" d="M82 144h36l-18 38z"/><path class="hu-tie" d="M100 150l-6 7 6 24 6-24z"/>
    <path class="hu-lapel" d="M82 144l18 38-11 6-15-38zM118 144l-18 38 11 6 15-38z"/>
    <circle class="hu-skin" cx="57" cy="94" r="9"/><circle class="hu-skin" cx="143" cy="94" r="9"/><circle class="hu-skin" cx="100" cy="88" r="44"/>
    <path class="hu-hair" d="M55 92c-4-34 18-56 46-56 29 0 50 20 46 54-5-11-9-19-16-25-16 11-42 15-64 9-6 5-10 11-12 18z"/>
    <ellipse class="hu-eye" cx="84" cy="96" rx="4.6" ry="6"/><ellipse class="hu-eye" cx="116" cy="96" rx="4.6" ry="6"/>
    <circle class="hu-cheek" cx="72" cy="110" r="6"/><circle class="hu-cheek" cx="128" cy="110" r="6"/><path class="hu-smile" d="M92 112q8 7 16 0"/>
  </symbol>
  <symbol id="mR" viewBox="0 0 48 48"><path d="M8 31c-2-10 6-19 17-19s18 8 16 18c-1 8-9 11-16 11-9 0-16-3-17-10z"/></symbol>
  <symbol id="mP" viewBox="0 0 48 48"><path d="M11 5h20l9 9v29H11z"/><path d="M31 5v9h9" fill="#fff" opacity=".45"/></symbol>
  <symbol id="mS" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"><circle cx="14" cy="35" r="6.5"/><circle cx="34" cy="35" r="6.5"/><path d="M18 30 35 6M30 30 13 6"/></g></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<div class="frame" id="frame">
  <section class="scene">
    <div class="tag bot">The Bot<small>That's us</small></div>
    <div class="tag hum">Your friend<small>Playing from the corner</small></div>
    <div class="mid">
      <div class="score"><span><span id="sBot">0</span><small>Bot</small></span><span class="dash">–</span><span><span id="sHum">0</span><small>Friend</small></span></div>
      <p id="roundLab">Best of 3 · Round 1</p>
    </div>
    <div class="bust bot"><svg><use href="#robot"/></svg></div>
    <div class="bust hum"><svg><use href="#human"/></svg></div>
    <div class="tbl"></div>
    <div class="prev" id="prev"></div>
  </section>

  <section class="play">
    <h2>Their move<small>Click what your friend threw</small></h2>
    <button class="mv" data-m="R"><svg class="ic mR"><use href="#mR"/></svg>Rock<kbd>R</kbd></button>
    <button class="mv" data-m="P"><svg class="ic mP"><use href="#mP"/></svg>Paper<kbd>P</kbd></button>
    <button class="mv" data-m="S"><svg class="ic mS"><use href="#mS"/></svg>Scissors<kbd>S</kbd></button>
    <span class="sp"></span>
    <div class="len" role="group" aria-label="Match length"><button data-n="3" aria-pressed="true">Best of 3</button><button data-n="5" aria-pressed="false">Best of 5</button></div>
    <button class="ghost" id="reset">New match</button>
  </section>

  <section class="maths" id="maths">
    <div class="mhead">
      <h3>How we pick our move</h3><span class="x" id="xLab"></span>
      <button class="ghost tog" id="tog" aria-expanded="true" aria-controls="steps"><span id="togLab">Hide working</span><svg><use href="#chev"/></svg></button>
    </div>
    <div class="steps" id="steps">
      <div class="step">
        <div class="sh"><i>1</i>Predict<em>q = P x</em></div>
        <div class="sum" id="sum1"></div>
        <div class="body">
          <p class="note" id="note1"></p>
          <div class="vb" id="qBars" style="margin-top:12px"></div>
          <div class="vl"><span>Rock</span><span>Paper</span><span>Scissors</span></div>
        </div>
      </div>
      <div class="step">
        <div class="sh"><i>2</i>Score<em>A q</em></div>
        <div class="sum" id="sum2"></div>
        <div class="body">
          <div class="stk" id="stk" style="margin-top:12px"></div>
          <div class="key"><span><i style="background:var(--w)"></i>We win</span><span><i style="background:var(--t)"></i>Tie</span><span><i style="background:var(--l)"></i>We lose</span></div>
        </div>
      </div>
      <div class="step">
        <div class="sh"><i>3</i>Choose<em>largest entry</em></div>
        <div class="sum" id="sum3"></div>
        <div class="body">
          <div class="ch" id="choice"></div>
          <p class="flag" id="flag"></p>
          <p class="note">Ties break in the order R, P, S.</p>
        </div>
      </div>
    </div>
  </section>

  <div class="over" id="over"><div><h2 id="overH"></h2><p id="overP"></p><button id="again">New match</button></div></div>
</div>

<script>
// Pooled bot decisions from web/public/bots/bot_rps_human_combined.json (opening = round 1 from π).
var D={"opening":{"q":[0.356,0.326,0.318],"scores":[-0.008,0.038,-0.03],"move":"P","counter_move":"P","splits":[[0.318,0.356,0.326],[0.356,0.326,0.318],[0.326,0.318,0.356]]},"RW":{"q":[0.352,0.354,0.294],"scores":[-0.06,0.058,0.003],"move":"P","counter_move":"S","splits":[[0.294,0.352,0.354],[0.352,0.354,0.294],[0.354,0.294,0.352]]},"RL":{"q":[0.356,0.338,0.306],"scores":[-0.032,0.049,-0.018],"move":"P","counter_move":"P","splits":[[0.306,0.356,0.338],[0.356,0.338,0.306],[0.338,0.306,0.356]]},"RT":{"q":[0.373,0.292,0.334],"scores":[0.042,0.039,-0.081],"move":"R","counter_move":"P","splits":[[0.334,0.373,0.292],[0.373,0.292,0.334],[0.292,0.334,0.373]]},"PW":{"q":[0.299,0.327,0.374],"scores":[0.047,-0.074,0.027],"move":"R","counter_move":"R","splits":[[0.374,0.299,0.327],[0.299,0.327,0.374],[0.327,0.374,0.299]]},"PL":{"q":[0.322,0.318,0.36],"scores":[0.042,-0.039,-0.003],"move":"R","counter_move":"R","splits":[[0.36,0.322,0.318],[0.322,0.318,0.36],[0.318,0.36,0.322]]},"PT":{"q":[0.358,0.319,0.323],"scores":[0.004,0.034,-0.038],"move":"P","counter_move":"P","splits":[[0.323,0.358,0.319],[0.358,0.319,0.323],[0.319,0.323,0.358]]},"SW":{"q":[0.354,0.319,0.326],"scores":[0.007,0.028,-0.035],"move":"P","counter_move":"P","splits":[[0.326,0.354,0.319],[0.354,0.319,0.326],[0.319,0.326,0.354]]},"SL":{"q":[0.286,0.351,0.363],"scores":[0.012,-0.078,0.065],"move":"S","counter_move":"R","splits":[[0.363,0.286,0.351],[0.286,0.351,0.363],[0.351,0.363,0.286]]},"ST":{"q":[0.298,0.351,0.351],"scores":[0,-0.052,0.053],"move":"S","counter_move":"S","splits":[[0.351,0.298,0.351],[0.298,0.351,0.351],[0.351,0.351,0.298]]}};
var A=[[0,-1,1],[1,0,-1],[-1,1,0]],M=["R","P","S"],NAME={R:"Rock",P:"Paper",S:"Scissors"},OUT={W:"won",L:"lost",T:"tied"};
var g;
function newMatch(n){g={n:n||(g?g.n:3),bot:0,hum:0,round:1,last:null,prev:null,over:false};render();}
function $(id){return document.getElementById(id);}
function f(v){return (v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(3);}
function u(v){return v.toFixed(3);}
function vec(a,sign){return '<span class="vec h">'+a.map(function(v){return "<span>"+(sign?f(v):u(v))+"</span>";}).join("")+'</span><span class="vt">T</span>';}
function icon(m,cls){return '<svg class="ic m'+m+(cls?" "+cls:"")+'"><use href="#m'+m+'"/></svg>';}
function card(m,side,won){return '<div class="crd '+side+(won?" won":"")+'">'+icon(m)+NAME[m]+"</div>";}
function render(){
  var d=g.last?D[g.last]:D.opening, need=(g.n+1)/2;
  $("sBot").textContent=g.bot;$("sHum").textContent=g.hum;
  $("roundLab").textContent="Best of "+g.n+" · first to "+need+" · Round "+g.round;
  if(g.prev){var p=g.prev;
    $("prev").innerHTML=card(p.b,"b",p.o==="L")+'<div class="pcap">Round '+p.round+": "+(p.o==="T"?"tie, replayed":p.o==="L"?"we won":"they won")+"</div>"+card(p.h,"h",p.o==="W");
  } else $("prev").innerHTML='<div class="crd b empty">Our card</div><div class="pcap">No previous round yet</div><div class="crd h empty">Their card</div>';
  $("xLab").innerHTML=g.last?"x = <b>"+g.last+"</b>: they played "+NAME[g.last[0]]+" and "+OUT[g.last[1]]:"x = <b>π</b>: no previous round, so we use the long run";
  $("sum1").innerHTML=(g.last?"q = ":"q₀ = ")+vec(d.q);
  $("note1").textContent=g.last?"One-hot x picks column "+g.last+" of P, so this step is a lookup.":"P π averages all 9 columns of P, weighted by the steady state.";
  var mx=Math.max.apply(null,d.q);
  $("qBars").innerHTML=d.q.map(function(v,i){return "<div>"+u(v)+'<i style="height:'+(v/mx*76)+"px;background:var(--"+M[i].toLowerCase()+')"></i></div>';}).join("");
  $("sum2").innerHTML="A q = "+vec(d.scores,true);
  var bi=M.indexOf(d.move);
  $("stk").innerHTML=d.splits.map(function(s,i){return '<div class="st'+(i===bi?" pick":"")+'"><span>'+icon(M[i])+" "+M[i]+'</span><span class="sb"><i style="width:'+s[0]*100+'%;background:var(--w)"></i><i style="width:'+s[1]*100+'%;background:var(--t)"></i><i style="width:'+s[2]*100+'%;background:var(--l)"></i></span><span>'+f(d.scores[i])+"</span></div>";}).join("");
  $("sum3").innerHTML="We play "+icon(d.move)+" "+NAME[d.move];
  $("choice").innerHTML=icon(d.move)+"<div><b>"+NAME[d.move]+"</b><span>Largest entry, "+f(d.scores[bi])+". Wins "+u(d.splits[bi][0])+", ties "+u(d.splits[bi][1])+", loses "+u(d.splits[bi][2])+".</span></div>";
  var qi=d.q.indexOf(mx),flag=d.move!==d.counter_move;
  $("flag").className="flag"+(flag?" on":"");
  $("flag").textContent=flag?"Not the counter to their likeliest move ("+NAME[M[qi]]+"), which is "+NAME[d.counter_move]+".":"";
  document.querySelectorAll(".mv").forEach(function(b){b.disabled=g.over;});
  document.querySelectorAll(".len button").forEach(function(b){b.setAttribute("aria-pressed",String(+b.dataset.n===g.n));b.disabled=g.round>1&&!g.over;});
  $("over").className="over"+(g.over?" on":"");
  if(g.over){$("overH").textContent=g.bot>g.hum?"We win the match":"Your friend wins";$("overP").textContent="Final score: Bot "+g.bot+" – "+g.hum+" Friend";}
}
function play(h){
  if(g.over)return;
  var d=g.last?D[g.last]:D.opening,b=d.move,a=A[M.indexOf(b)][M.indexOf(h)];
  var o=a===1?"L":a===-1?"W":"T";            // outcome from the human's side
  if(o==="L")g.bot++;else if(o==="W")g.hum++;
  g.prev={b:b,h:h,o:o,round:g.round};g.last=h+o;g.round++;
  if(g.bot===(g.n+1)/2||g.hum===(g.n+1)/2)g.over=true;
  render();
}
document.querySelectorAll(".mv").forEach(function(b){b.onclick=function(){play(b.dataset.m);};});
document.querySelectorAll(".len button").forEach(function(b){b.onclick=function(){g.n=+b.dataset.n;render();};});
$("reset").onclick=$("again").onclick=function(){newMatch();};
$("tog").onclick=function(){var c=$("maths").classList.toggle("closed");this.setAttribute("aria-expanded",String(!c));$("togLab").textContent=c?"Show working":"Hide working";};
addEventListener("keydown",function(e){var k=e.key.toUpperCase();if(M.indexOf(k)>=0&&!e.metaKey&&!e.ctrlKey)play(k);});
function fit(){var s=Math.min(innerWidth/1440,innerHeight/900),fr=$("frame");fr.style.transform="scale("+s+") translate(-50%,-50%)";}
addEventListener("resize",fit);fit();
newMatch(3);
if(location.hash==="#demo"){play("R");}
if(location.hash==="#closed"){play("R");$("tog").click();}
</script>
</body></html>
